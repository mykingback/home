name: TVBox 接口每日更新

on:
  schedule:
    # 每天 00:00 UTC = 08:00 北京时间
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests
      - name: 抓取并整理接口
        run: python tvbox/crawl.py --out tvbox
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvbox/vod.txt tvbox/live.txt tvbox/interfaces.json tvbox/README.md
          git diff --cached --quiet || git commit -m "TVBox 接口每日更新 $(date -u +%Y-%m-%d)"
          git push
